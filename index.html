<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sri Gowthami Regional Library | Rajamahendravaram</title>

  <link rel="icon"
    href="https://png.pngtree.com/png-vector/20240604/ourmid/pngtree-old-books-isolated-on-transparent-background-png-image_12524844.png"
    type="image/x-icon">

  <meta name="description"
    content="Sri Gowthami Regional Library, Rajamahendravaram, Andhra Pradesh. A library founded in 1898, taken over by the Government of Andhra Pradesh in 1979, with about 1,40,000 books and 417 palm-leaf manuscripts.">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Inter:wght@300;400;500;600&family=Mandali&display=swap"
    rel="stylesheet">

  <style>
    :root {
      --primary-dark: #1B0F0A;
      --primary-burgundy: #64182B;
      --accent-gold: #C7A45A;
      --gold-deep: #8A682D;
      --text-dark: #2A211D;
      --text-muted: #665B54;
      --bg-parchment: #F7F1E8;
      --bg-card: #FFFCF7;
      --bg-secondary: #EEE4D6;
      --border-color: #DCCDBB;
      --shadow-sm: 0 4px 14px rgba(27, 15, 10, .08);
      --shadow-md: 0 10px 28px rgba(27, 15, 10, .14);
      --shadow-lg: 0 18px 45px rgba(27, 15, 10, .18);
      --transition: all .25s ease;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 120px;
    }

    body {
      font-family: 'Inter', 'Mandali', sans-serif;
      background: linear-gradient(180deg, #FBF7F1 0%, var(--bg-parchment) 100%);
      color: var(--text-dark);
      line-height: 1.7;
      overflow-x: hidden;
    }

    h1,
    h2,
    h3,
    h4 {
      font-family: "Cormorant Garamond", "Mandali", serif;
      letter-spacing: 0.3px;
      line-height: 1.2;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    ul {
      list-style: none;
    }

    :focus-visible {
      outline: 3px solid var(--accent-gold);
      outline-offset: 2px;
    }

    .top-bar {
      background-color: var(--primary-dark);
      color: #E8E2D8;
      font-size: 0.82rem;
      padding: 8px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--accent-gold);
    }

    .top-bar .quick-links a {
      margin-left: 18px;
      color: #E8E2D8;
      transition: var(--transition);
    }

    .top-bar .quick-links a:hover {
      color: var(--accent-gold);
    }

    header.main-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: rgba(255, 252, 247, .98);
      border-bottom: 1px solid var(--border-color);
      box-shadow: 0 4px 20px rgba(27, 15, 10, .10);
      backdrop-filter: blur(10px);
    }

    .header-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding: 12px 6%;
      min-width: 0;
    }

    .logo-brand {
      display: flex;
      align-items: center;
      gap: 16px;
      min-width: 0;
    }

    .logo-emblem {
      width: 56px;
      height: 56px;
      flex: 0 0 56px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--primary-burgundy), var(--primary-dark));
      color: var(--accent-gold);
      border: 2px solid var(--accent-gold);
      border-radius: 50%;
      box-shadow: 0 6px 16px rgba(27, 15, 10, .22);
    }

    .logo-emblem svg {
      width: 28px;
      height: 28px;
    }

    .brand-text h1 {
      font-size: 1.45rem;
      color: var(--primary-burgundy);
      font-weight: 700;
      letter-spacing: .4px;
      overflow-wrap: anywhere;
    }

    .brand-text p {
      font-size: .85rem;
      color: var(--text-muted);
      font-weight: 500;
      overflow-wrap: anywhere;
    }

    .mobile-toggle {
      display: none;
      width: 46px;
      height: 42px;
      flex: 0 0 46px;
      align-items: center;
      justify-content: center;
      padding: 0;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      background: #FFFCF7;
      color: var(--primary-burgundy);
      font-size: 1.55rem;
      line-height: 1;
      cursor: pointer;
    }

    nav.nav-bar {
      background: linear-gradient(90deg, #1B0F0A 0%, #2A120F 48%, #1B0F0A 100%);
      box-shadow: 0 5px 16px rgba(27, 15, 10, .12);
    }

    .nav-container {
      padding: 0 6%;
      min-width: 0;
    }

    .nav-menu {
      display: flex;
      align-items: center;
      flex-wrap: nowrap;
      justify-content: space-between;
      width: 100%;
      overflow-x: auto;
      scrollbar-width: none;
    }

    .nav-menu::-webkit-scrollbar {
      display: none;
    }

    .nav-item {
      flex: 0 0 auto;
      position: relative;
    }

    .nav-link {
      position: relative;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 13px 14px;
      background: none;
      border: none;
      color: #F5EFE6;
      font: inherit;
      font-weight: 500;
      font-size: .86rem;
      transition: color .25s ease, background-color .25s ease, opacity .25s ease;
      overflow-wrap: anywhere;
      white-space: nowrap;
      cursor: pointer;
    }

    .nav-link:hover,
    .nav-item.active>.nav-link {
      background-color: var(--primary-burgundy);
      color: var(--accent-gold);
    }

    .nav-link .caret {
      display: inline-block;
      font-size: .7em;
      line-height: 1;
      transition: transform .2s ease;
    }

    .nav-item.open>.nav-link .caret {
      transform: rotate(180deg);
    }

    /* --- placeholder ("work in progress") items: a lighter, disabled look --- */
    .nav-item.wip>.nav-link,
    .dropdown-link[data-wip] {
      opacity: .5;
    }

    .nav-item.wip>.nav-link:hover,
    .dropdown-link[data-wip]:hover {
      opacity: .85;
    }

    /* --- dropdown submenus --- */
    .dropdown-menu {
      position: absolute;
      top: 100%;
      left: 0;
      min-width: 230px;
      margin: 0;
      padding: 6px 0;
      list-style: none;
      background: #241210;
      border: 1px solid rgba(197, 164, 90, .35);
      border-radius: 7px;
      box-shadow: var(--shadow-lg);
      display: none;
      flex-direction: column;
      z-index: 1500;
    }

    .nav-item.has-dropdown.open>.dropdown-menu {
      display: flex;
    }

    .dropdown-link {
      display: block;
      padding: 10px 18px;
      color: #F5EFE6;
      font-size: .87rem;
      white-space: normal;
    }

    .dropdown-link:hover {
      background-color: var(--primary-burgundy);
      color: var(--accent-gold);
    }

    /* --- HERO BANNER (plain image, no overlay) --- */
    .hero-banner {
      padding: 26px 6% 6px;
      background: var(--bg-parchment);
      border-bottom: 4px solid var(--accent-gold);
    }

    .hero-banner .hero-img-wrap {
      max-width: 1180px;
      margin: 0 auto;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: var(--shadow-lg);
      border: 1px solid var(--border-color);
    }

    .hero-banner img {
      display: block;
      width: 100%;
      height: auto;
    }

    section {
      position: relative;
      padding: 68px 6%;
    }

    .container {
      width: 100%;
      max-width: 1120px;
      margin: 0 auto;
      min-width: 0;
    }

    .section-title {
      margin-bottom: 40px;
      text-align: center;
    }

    .section-title h2 {
      color: var(--primary-burgundy);
      font-size: clamp(1.9rem, 3vw, 2.3rem);
      letter-spacing: .5px;
    }

    .section-title p {
      margin-top: 6px;
      color: var(--text-muted);
      font-size: .95rem;
      overflow-wrap: anywhere;
    }

    .section-title::after {
      content: "";
      width: 60px;
      height: 3px;
      background: var(--accent-gold);
      display: block;
      margin: 12px auto 0;
      border-radius: 2px;
    }

    .about-grid {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(300px, .8fr);
      gap: 40px;
      align-items: start;
      min-width: 0;
    }

    .about-text p {
      margin-bottom: 16px;
      color: #333;
      font-size: 0.98rem;
      max-width: 68ch;
      line-height: 1.8;
      text-align: justify;
      text-justify: inter-word;
      overflow-wrap: anywhere;
    }

    .about-text p:last-child {
      margin-bottom: 0;
    }

    .fact-card {
      background: linear-gradient(180deg, rgba(255, 252, 247, .98), rgba(250, 243, 233, .98));
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      padding: 26px 28px;
      border-top: 4px solid var(--primary-burgundy);
      border-radius: 6px;
    }

    .fact-card h3 {
      font-size: 1.3rem;
      color: var(--primary-burgundy);
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border-color);
    }

    .fact-card dl div {
      display: flex;
      flex-direction: column;
      gap: 3px;
      padding: 9px 0;
      border-bottom: 1px dashed var(--border-color);
      font-size: .92rem;
    }

    .fact-card dl div:last-child {
      border-bottom: none;
    }

    .fact-card dt {
      min-width: 0;
      color: var(--text-muted);
      overflow-wrap: anywhere;
    }

    .fact-card dd {
      min-width: 0;
      font-weight: 600;
      text-align: left;
      overflow-wrap: anywhere;
    }

    .achievements {
      background: linear-gradient(180deg, #F1E8DB 0%, #E9DECF 100%);
    }

    .stats-strip {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      margin-bottom: 36px;
      overflow: hidden;
      border: 1px solid rgba(199, 164, 90, .24);
      border-radius: 7px;
      background: linear-gradient(135deg, var(--primary-dark), var(--primary-burgundy));
      box-shadow: var(--shadow-lg);
    }

    .stat-box {
      padding: 30px 22px;
      text-align: center;
      border-right: 1px solid rgba(199, 164, 90, .3);
      min-width: 0;
    }

    .stat-box:last-child {
      border-right: none;
    }

    .stat-box h3 {
      margin-bottom: 4px;
      color: var(--accent-gold);
      font-size: 2.6rem;
    }

    .stat-box p {
      color: #E8E2D8;
      font-size: .9rem;
      line-height: 1.4;
      overflow-wrap: anywhere;
    }

    .ach-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 22px;
      min-width: 0;
    }

    .ach-card {
      background: linear-gradient(180deg, rgba(255, 252, 247, .98), rgba(250, 243, 233, .98));
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      padding: 24px;
      border-left: 4px solid var(--accent-gold);
      border-radius: 6px;
    }

    .ach-card h3 {
      font-size: 1.35rem;
      color: var(--primary-burgundy);
      margin-bottom: 10px;
    }

    .ach-card p {
      font-size: 0.98rem;
      color: #333;
      margin-bottom: 0;
      line-height: 1.8;
      text-align: justify;
      text-justify: inter-word;
      overflow-wrap: anywhere;
    }

    .ach-card ul {
      margin: 6px 0 0;
      padding-left: 0;
      font-size: 0.95rem;
      color: #333;
      line-height: 1.7;
    }

    .ach-card ul li {
      position: relative;
      padding-left: 16px;
    }

    .ach-card ul li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--accent-gold);
    }

    .timeline {
      position: relative;
      width: 100%;
      max-width: 860px;
      margin: 0 auto;
      min-width: 0;
    }

    .timeline::before {
      content: "";
      position: absolute;
      top: 6px;
      bottom: 6px;
      left: 118px;
      width: 2px;
      background: linear-gradient(180deg, var(--accent-gold), var(--border-color), var(--accent-gold));
    }

    .t-item {
      position: relative;
      display: grid;
      grid-template-columns: 100px minmax(0, 1fr);
      gap: 40px;
      padding-bottom: 32px;
      min-width: 0;
    }

    .t-item:last-child {
      padding-bottom: 0;
    }

    .t-item::before {
      content: "";
      position: absolute;
      top: 8px;
      left: 111px;
      width: 16px;
      height: 16px;
      border: 3px solid var(--bg-parchment);
      border-radius: 50%;
      background: var(--accent-gold);
      box-shadow: 0 0 0 2px var(--gold-deep), 0 4px 10px rgba(27, 15, 10, .18);
    }

    .t-year {
      color: var(--primary-burgundy);
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.3;
      text-align: right;
      overflow-wrap: anywhere;
    }

    .t-body {
      background: linear-gradient(180deg, rgba(255, 252, 247, .98), rgba(250, 243, 233, .98));
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      padding: 18px 22px;
      border-radius: 6px;
    }

    .t-body h3 {
      margin-bottom: 6px;
      color: var(--primary-dark);
      font-size: 1.2rem;
      overflow-wrap: anywhere;
    }

    .t-body p {
      font-size: 0.96rem;
      color: #333;
      margin-bottom: 12px;
      line-height: 1.8;
      text-align: justify;
      text-justify: inter-word;
      overflow-wrap: anywhere;
    }

    .t-body p:last-child {
      margin-bottom: 0;
    }

    .memorial {
      background: linear-gradient(180deg, #F1E8DB 0%, #E9DECF 100%);
    }

    .memorial-box {
      background: linear-gradient(180deg, rgba(255, 252, 247, .98), rgba(250, 243, 233, .98));
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 36px;
      border-left: 4px solid var(--accent-gold);
      border-radius: 6px;
    }

    .memorial-box p {
      margin-bottom: 16px;
      font-size: 0.98rem;
      color: #333;
      max-width: 72ch;
      line-height: 1.8;
      text-align: justify;
      text-justify: inter-word;
      overflow-wrap: anywhere;
    }

    .memorial-box p:last-child {
      margin-bottom: 0;
    }

    .location-dark {
      color: #E8E2D8;
      background: linear-gradient(120deg, #150A07 0%, #2B1017 52%, #190C08 100%);
    }

    .location-dark .section-title h2 {
      color: var(--accent-gold);
    }

    .location-dark .section-title p {
      color: #C9BFB2;
    }

    .map-panel {
      display: grid;
      grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
      max-width: 1000px;
      width: 100%;
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(197, 160, 89, .45);
      border-radius: 8px;
      background: rgba(255, 255, 255, .035);
      box-shadow: var(--shadow-lg);
      backdrop-filter: blur(8px);
      min-width: 0;
    }

    .map-wrap {
      position: relative;
      min-height: 340px;
      background: var(--primary-dark);
    }

    .map-wrap iframe {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      filter: saturate(0.9);
    }

    .location-info {
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding: 34px 32px;
      min-width: 0;
    }

    .location-info h3 {
      font-size: 1.4rem;
      color: #FFF;
    }

    .location-info .addr-line {
      display: flex;
      gap: 12px;
      align-items: flex-start;
      font-size: 0.95rem;
      color: #E8E2D8;
      line-height: 1.5;
    }

    .location-info .addr-line svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      margin-top: 2px;
      color: var(--accent-gold);
    }

    .btn-custom {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 50px;
      padding: 12px 28px;
      border: 1px solid var(--accent-gold);
      border-radius: 5px;
      background: var(--accent-gold);
      color: var(--primary-dark);
      font-size: .94rem;
      font-weight: 600;
      transition: var(--transition);
      box-shadow: 0 5px 16px rgba(27, 15, 10, .18);
      text-align: center;
    }

    .btn-custom:hover {
      background: #FFF;
      border-color: #FFF;
      transform: translateY(-2px);
    }

    .location-info .btn-custom {
      align-self: flex-start;
      margin-top: 4px;
    }

    footer {
      padding-top: 50px;
      color: #D3C9BE;
      font-size: .9rem;
      border-top: 3px solid var(--accent-gold);
      background: linear-gradient(145deg, #100A06 0%, #1D0D0A 50%, #100A06 100%);
    }

    .footer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 35px;
      padding: 0 6% 40px;
      border-bottom: 1px solid rgba(255, 255, 255, .08);
      min-width: 0;
    }

    .footer-col {
      min-width: 0;
    }

    .footer-col h4 {
      color: var(--accent-gold);
      font-size: 1.2rem;
      margin-bottom: 14px;
    }

    .footer-col p,
    .footer-col li {
      margin-bottom: 8px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .footer-col a {
      color: #B8ADA0;
      transition: var(--transition);
    }

    .footer-col a:hover {
      color: var(--accent-gold);
    }

    .footer-bottom {
      text-align: center;
      padding: 16px 5%;
      font-size: 0.82rem;
      background: #1C0F0A;
      color: #B0A597;
    }

    .brand-text {
      min-width: 0;
    }

    .nav-link::after {
      content: "";
      position: absolute;
      left: 18px;
      right: 18px;
      bottom: 5px;
      height: 2px;
      background: var(--accent-gold);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .25s ease;
    }

    .header-container,
    .about-grid,
    .map-panel,
    .footer-grid,
    .t-item {
      min-width: 0;
    }

    .about-grid>*,
    .map-panel>* {
      min-width: 0;
    }

    /* --- TOAST ("work in progress") --- */
    .wip-toast {
      position: fixed;
      left: 50%;
      bottom: 28px;
      transform: translate(-50%, 16px);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 10px;
      max-width: 90vw;
      padding: 13px 22px;
      background: var(--primary-dark);
      color: #F5EFE6;
      border: 1px solid var(--accent-gold);
      border-radius: 999px;
      box-shadow: var(--shadow-lg);
      font-size: .9rem;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
    }

    .wip-toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .wip-toast svg {
      width: 17px;
      height: 17px;
      flex: 0 0 17px;
      color: var(--accent-gold);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      * {
        transition: none !important;
      }
    }

    @media (max-width: 1100px) {
      .header-container {
        padding-left: 4%;
        padding-right: 4%;
      }

      .nav-container {
        padding-left: 4%;
        padding-right: 4%;
      }

      .nav-link {
        padding-left: 11px;
        padding-right: 11px;
        font-size: .82rem;
      }

      .nav-link::after {
        left: 11px;
        right: 11px;
      }
    }

    @media (max-width: 992px) {
      .about-grid {
        grid-template-columns: 1fr;
        gap: 28px;
      }

      .stats-strip {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .stat-box {
        border-right: 1px solid rgba(199, 164, 90, .3);
      }

      .stat-box:nth-child(2) {
        border-right: none;
      }

      .stat-box:nth-child(-n+2) {
        border-bottom: 1px solid rgba(199, 164, 90, .3);
      }

      .ach-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .map-panel {
        grid-template-columns: 1fr;
      }

      .map-wrap {
        min-height: 300px;
      }

      .footer-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 768px) {
      .top-bar {
        display: none;
      }

      .header-container {
        padding: 10px 5%;
        gap: 12px;
      }

      .logo-brand {
        gap: 10px;
      }

      .logo-emblem {
        width: 48px;
        height: 48px;
        flex-basis: 48px;
      }

      .logo-emblem svg {
        width: 24px;
        height: 24px;
      }

      .brand-text {
        flex: 1 1 auto;
      }

      .brand-text h1 {
        font-size: clamp(.95rem, 4.2vw, 1.15rem);
        line-height: 1.15;
      }

      .brand-text p {
        font-size: clamp(.62rem, 2.7vw, .72rem);
        line-height: 1.3;
      }

      .mobile-toggle {
        display: flex;
      }

      .nav-container {
        padding: 0;
      }

      .nav-menu {
        display: none;
        flex-direction: column;
        align-items: stretch;
        flex-wrap: nowrap;
        justify-content: flex-start;
        width: auto;
        max-height: 70vh;
        overflow-y: auto;
      }

      .nav-menu.active {
        display: flex;
      }

      .nav-item {
        width: 100%;
      }

      .nav-link {
        width: 100%;
        padding: 13px 5%;
        font-size: .92rem;
        border-bottom: 1px solid rgba(255, 255, 255, .06);
      }

      .nav-link::after {
        left: 5%;
        right: auto;
        width: 70px;
      }

      /* on mobile, dropdowns expand inline instead of floating */
      .dropdown-menu {
        position: static;
        min-width: 0;
        margin: 0;
        padding: 0;
        border: none;
        border-radius: 0;
        box-shadow: none;
        background: rgba(0, 0, 0, .18);
      }

      .dropdown-link {
        padding: 12px 9%;
        border-bottom: 1px solid rgba(255, 255, 255, .05);
      }

      .hero-banner {
        padding: 16px 4% 4px;
      }

      .hero-banner .hero-img-wrap {
        border-radius: 7px;
      }

      section {
        padding: 48px 5%;
      }

      .section-title {
        margin-bottom: 30px;
      }

      .section-title h2 {
        font-size: 2rem;
      }

      .section-title p {
        font-size: .9rem;
      }

      .about-text p,
      .ach-card p,
      .t-body p,
      .memorial-box p {
        text-align: left;
        font-size: .95rem;
        line-height: 1.75;
      }

      .fact-card,
      .ach-card,
      .memorial-box {
        padding: 22px 18px;
      }

      .stats-strip,
      .ach-grid,
      .footer-grid {
        grid-template-columns: 1fr;
      }

      .stat-box {
        border-right: none !important;
        border-bottom: 1px solid rgba(199, 164, 90, .3);
      }

      .stat-box:last-child {
        border-bottom: none;
      }

      .timeline::before {
        left: 7px;
      }

      .t-item {
        grid-template-columns: 1fr;
        gap: 8px;
        padding-left: 32px;
      }

      .t-item::before {
        left: 0;
      }

      .t-year {
        text-align: left;
        font-size: 1.35rem;
      }

      .t-body {
        padding: 18px 20px;
      }

      .map-wrap {
        min-height: 290px;
      }

      .location-info {
        padding: 28px 22px;
      }

      .footer-grid {
        padding-left: 5%;
        padding-right: 5%;
      }

      .wip-toast {
        bottom: 18px;
        font-size: .85rem;
        padding: 11px 18px;
      }
    }

    @media (max-width: 560px) {
      .header-container {
        padding-left: 4%;
        padding-right: 4%;
      }

      .logo-brand {
        gap: 8px;
      }

      .logo-emblem {
        width: 44px;
        height: 44px;
        flex-basis: 44px;
      }

      .logo-emblem svg {
        width: 22px;
        height: 22px;
      }

      .brand-text h1 {
        font-size: .98rem;
      }

      .brand-text p {
        font-size: .64rem;
      }

      .section-title h2 {
        font-size: 1.85rem;
      }

      section {
        padding: 42px 4%;
      }

      .fact-card,
      .ach-card,
      .memorial-box {
        padding: 20px 16px;
      }

      .map-wrap {
        min-height: 250px;
      }

      .location-info {
        padding: 22px 18px;
      }
    }
  </style>
</head>

<body>

  <div id="History-Page">

    <section id="history">

      <div class="container">


        <div class="section-title">

          <h2>Work in Progress</h2>

          <p>Contact Developer</p><br/>

        </div>

      </div>

    </section>

  </div>

  <script>

    const toggle = document.getElementById('mobileToggle');
    const menu = document.getElementById('navMenu');
    const homePage = document.getElementById('Home-Page');
    const historyPage = document.getElementById('History-Page');
    const navItems = document.querySelectorAll('.nav-item');
    const homeSectionIds = ['top', 'about', 'achievements', 'memorial', 'location'];
    const homeSections = homeSectionIds.map(id => document.getElementById(id));

    function closeMobileMenu() {
      menu.classList.remove('active');
      toggle.setAttribute('aria-expanded', 'false');
      toggle.setAttribute('aria-label', 'Open menu');
    }

    toggle.addEventListener('click', () => {
      const open = menu.classList.toggle('active');
      toggle.setAttribute('aria-expanded', open);
      toggle.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    });

    // --- "work in progress" toast for the placeholder nav buttons ---
    let toastTimer = null;
    function showWipToast(label) {
      const toast = document.getElementById('wipToast');
      const text = document.getElementById('wipToastText');
      text.textContent = label + ' — this page is still work in progress.';
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // --- page switching: Timeline is its own page; every other link shows the main page ---
    function showPage(page) {
      const showHistory = page === 'history';
      homePage.style.display = showHistory ? 'none' : 'block';
      historyPage.style.display = showHistory ? 'block' : 'none';
      updateActive();
    }

    function updateActive() {
      const historyVisible = historyPage.style.display !== 'none';

      if (historyVisible) {
        navItems.forEach(item => {
          const link = item.querySelector('.nav-link');
          item.classList.toggle('active', !!link && link.getAttribute('href') === '#history');
        });
        return;
      }

      const y = window.scrollY + 140;
      let currentId = 'top';
      homeSections.forEach(sec => {
        if (sec && sec.offsetTop <= y) currentId = sec.id;
      });

      navItems.forEach(item => {
        const link = item.querySelector('.nav-link');
        if (!link || link.hasAttribute('data-wip')) {
          item.classList.remove('active');
          return;
        }
        item.classList.toggle('active', link.getAttribute('href') === '#' + currentId);
      });
    }

    document.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', e => {

        // placeholder buttons: show a toast, go nowhere
        if (link.hasAttribute('data-wip')) {
          e.preventDefault();
          showWipToast(link.getAttribute('data-wip'));
          closeMobileMenu();
          return;
        }

        const href = link.getAttribute('href') || '';
        if (!href.startsWith('#') || href.length < 2) return; // external links (maps, etc.) behave normally

        const id = href.slice(1);
        e.preventDefault();
        closeMobileMenu();
        showPage(id === 'history' ? 'history' : 'home');
        requestAnimationFrame(() => {
          const el = document.getElementById(id);
          if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
          history.replaceState(null, '', href);
        });
      });
    });

    // open directly on the Timeline page if the URL already has #history
    if (window.location.hash === '#history') {
      showPage('history');
    }

    window.addEventListener('scroll', updateActive, { passive: true });

    window.addEventListener('load', () => {
      if (window.location.hash !== '#history') window.scrollTo(0, 0);
      updateActive();
    });

  </script>

</body>

</html>
